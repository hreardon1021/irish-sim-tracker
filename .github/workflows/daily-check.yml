name: Daily SIM Plan Check

on:
  schedule:
    - cron: '0 7 * * *'  # 08:00 Irish time (UTC+1 summer / UTC winter)
  workflow_dispatch:
    inputs:
      force_notify:
        description: 'Force send notification even if no changes'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  check-plans:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run scraper
        id: scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          node src/scraper.js
          EXIT_CODE=$?
          echo "exit_code=${EXIT_CODE}" >> $GITHUB_OUTPUT
          if [ $EXIT_CODE -eq 1 ]; then
            echo "Scraper failed with fatal error"
            exit 1
          fi

      - name: Build change summary
        id: summary
        if: steps.scraper.outputs.exit_code == '2' || github.event.inputs.force_notify == 'true'
        run: |
          SUMMARY=$(node -e "
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync('data/latest-changes.json','utf8'));
            const lines = [];
            if (r.added.length)   lines.push('NEW: ' + r.added.map(p => p.carrierDisplay + ' ' + p.name + ' €' + (p.promoPrice ?? p.priceEur) + '/mo').join(', '));
            if (r.removed.length) lines.push('REMOVED: ' + r.removed.map(p => p.carrierDisplay + ' ' + p.name).join(', '));
            if (r.changed.length) lines.push('CHANGED: ' + r.changed.map(({plan,diffs}) => plan.carrierDisplay + ' ' + plan.name + ' (' + Object.entries(diffs).map(([k,{from,to}]) => k+': '+from+' -> '+to).join(', ') + ')').join('; '));
            console.log(lines.join('\n'));
          ")
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$SUMMARY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send email alert
        if: steps.scraper.outputs.exit_code == '2' || github.event.inputs.force_notify == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "📱 Irish SIM Plan Change Detected"
          to: ${{ secrets.GMAIL_USERNAME }}
          from: Irish SIM Tracker
          body: |
            A change was detected in Irish SIM plans:

            ${{ steps.summary.outputs.body }}

            View the full dashboard: https://hreardon1021.github.io/irish-sim-tracker/

      - name: Commit updated data files
        if: steps.scraper.outputs.exit_code == '2'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/plans.json data/latest-changes.json data/history.json
          git commit -m "chore: update SIM plan data $(date -u +'%Y-%m-%d')" || echo "No changes to commit"
          git push
