name: Daily SIM Plan Check

on:
  schedule:
    - cron: '0 7 * * *'  # 08:00 Irish time (UTC+1 summer / UTC winter)
  workflow_dispatch:
    inputs:
      force_notify:
        description: 'Force send notification even if no changes'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  check-plans:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run scraper
        id: scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          node src/scraper.js
          EXIT_CODE=$?
          echo "exit_code=${EXIT_CODE}" >> $GITHUB_OUTPUT
          if [ $EXIT_CODE -eq 1 ]; then
            echo "Scraper failed with fatal error"
            exit 1
          fi

      - name: Notify on changes
        if: steps.scraper.outputs.exit_code == '2' || github.event.inputs.force_notify == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          FORCE_NOTIFY: ${{ github.event.inputs.force_notify }}
        run: node src/notifier.js

      - name: Commit updated data files
        if: steps.scraper.outputs.exit_code == '2'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/plans.json data/latest-changes.json data/history.json
          git commit -m "chore: update SIM plan data $(date -u +'%Y-%m-%d')" || echo "No changes to commit"
          git push
